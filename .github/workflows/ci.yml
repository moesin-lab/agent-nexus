name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-checks:
    name: Source checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: node scripts/validate-pr-metadata.mjs --self-test

      - run: node scripts/posttool-pr-check-guard.mjs --self-test

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm test

  packed-cli:
    name: Packed CLI (${{ matrix.runner }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify:pack:cli

  check:
    needs: [source-checks, packed-cli]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      SOURCE_CHECKS_RESULT: ${{ needs.source-checks.result }}
      PACKED_CLI_RESULT: ${{ needs.packed-cli.result }}
    steps:
      - name: Require every CI matrix to pass
        run: |
          test "$SOURCE_CHECKS_RESULT" = "success"
          test "$PACKED_CLI_RESULT" = "success"
