name: Publish npm CLI

on:
  workflow_dispatch:
    inputs:
      confirm-version:
        description: Type the package version selected by the release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.artifact.outputs.filename }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Install terminal-session integration dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - run: pnpm build

      - run: pnpm test

      - run: pnpm pack:cli

      - name: Resolve and validate release artifact
        id: artifact
        env:
          RELEASE_CONFIRM_VERSION: ${{ inputs.confirm-version }}
        run: node scripts/prepare-npm-release.mjs

      - name: Verify exact packed artifact
        run: node scripts/verify-packed-cli.mjs "${{ steps.artifact.outputs.tarball }}"

      - name: Stage verified artifact
        env:
          FILENAME: ${{ steps.artifact.outputs.filename }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: |
          mkdir release-artifact
          cp "$TARBALL" "release-artifact/$FILENAME"
          cd release-artifact
          sha256sum "$FILENAME" > SHA256SUMS

      - name: Upload verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-cli-${{ steps.artifact.outputs.version }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require trusted-publishing-compatible npm
        run: >-
          node -e "const [major,minor,patch]=require('node:child_process').execFileSync('npm',['--version'],{encoding:'utf8'}).trim().split('.').map(Number);if(major<11||(major===11&&(minor<5||(minor===5&&patch<1))))throw new Error('npm >= 11.5.1 is required')"

      - name: Download verified artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-cli-${{ needs.build.outputs.version }}
          path: release-artifact

      - name: Match artifact digest
        working-directory: release-artifact
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          TARBALL: ${{ needs.build.outputs.filename }}
        run: |
          sha256sum --check SHA256SUMS
          node -e "const c=require('node:crypto'),f=require('node:fs');const h=c.createHash('sha256').update(f.readFileSync(process.env.TARBALL)).digest('hex');if(h!==process.env.EXPECTED_SHA256)throw new Error('release artifact digest mismatch')"

      - name: Publish exact verified artifact
        working-directory: release-artifact
        run: >-
          npm publish "$TARBALL"
          --access public
          --tag latest
        env:
          TARBALL: ${{ needs.build.outputs.filename }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
